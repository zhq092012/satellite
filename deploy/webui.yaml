---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: satellite
  name: satellite-web-pv
spec:
  capacity:
    storage: 50Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  nfs:
    path: /mnt/storepool/xajdlab/satellite/webui
    server: 192.168.100.60

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: satellite
  name: satellite-web-pvc
spec:
  storageClassName: nfs-storage
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: satellite
  name: satellite-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satellite-web
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: satellite-web
    spec:
      containers:
        - name: satellite-web
          image: 192.168.100.13/kgms/satellite-webui:0.0.1
          imagePullPolicy: "IfNotPresent"
          #imagePullPolicy: "Always"
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: webui-vol
              mountPath: /etc/nginx/conf.d/
              subPath: config
            - name: webui-vol
              mountPath: /etc/log/nginx
              subPath: logs
      volumes:
      - name: webui-vol
        persistentVolumeClaim:
          claimName: satellite-web-pvc

---
apiVersion: v1
kind: Service
metadata:
  namespace: satellite
  name: satellite-web-svc
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: satellite-web

---
apiVersion: v1
kind: Service
metadata:
  namespace: satellite
  name: satellite-web-ext-svc
spec:
  type: NodePort
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 32180
  selector:
    app: satellite-web
